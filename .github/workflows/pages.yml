name: Publish prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare current prototype only
        run: |
          mkdir -p dist/design-concepts
          cp preview.html dist/index.html
          cp preview.html dist/preview.html
          cp preview.css atmosphere.css concept-story.css works-wave.css member-transition.css dist/
          cp preview.js works-wave.js member-transition.js concept-story.js smooth-scroll.js hero-particles.js concept-liquid.js dist/
          cp -R assets dist/assets
          cp design-concepts/members-original-transparent.png dist/design-concepts/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
